<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 0 - Simple Contact Form</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body>
  <a href="index.html" class="back-link">&larr; Back to all tasks</a>
  <div class="plain-page">
  <h1>Contact Us</h1>
  <form action="#" method="post">
    <p>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name">
    </p>
    <p>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email">
    </p>
    <p>
      <label for="message">Message:</label><br>
      <textarea id="message" name="message" rows="5" cols="40"></textarea>
    </p>
    <button type="submit">Send</button>
  </form>
  </div>
</body>
</html>
