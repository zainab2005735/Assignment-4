<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 - Bootstrap Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link href="theme.css" rel="stylesheet">
</head>
<body class="bg-light">
  <a href="index.html" class="back-link">&larr; Back to all tasks</a>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4">Contact Us</h1>
            <form id="contactForm" action="#" method="post" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="name" class="form-label">Name</label>
                  <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required minlength="2">
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback">Name is required (at least 2 characters).</div>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback" id="emailError">Email is required.</div>
                </div>
                <div class="col-12">
                  <label for="message" class="form-label">Message</label>
                  <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..." required minlength="10"></textarea>
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback">Message must be at least 10 characters.</div>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary">Send</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // get the form and the inputs
    let form = document.getElementById("contactForm");
    let nameInput = document.getElementById("name");
    let emailInput = document.getElementById("email");
    let messageInput = document.getElementById("message");
    let emailError = document.getElementById("emailError");

    // show green or red border depending on the input
    function checkInput(input) {
      if (input.checkValidity()) {
        input.classList.add("is-valid");
        input.classList.remove("is-invalid");
      } else {
        input.classList.add("is-invalid");
        input.classList.remove("is-valid");
      }
    }

    // different message for empty email and wrong email
    function checkEmail() {
      if (emailInput.value === "") {
        emailError.textContent = "Email is required.";
      } else {
        emailError.textContent = "Please enter a valid email address.";
      }
      checkInput(emailInput);
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      checkInput(nameInput);
      checkEmail();
      checkInput(messageInput);

      if (form.checkValidity()) {
        alert("Form submitted successfully!");
        form.reset();
        nameInput.classList.remove("is-valid");
        emailInput.classList.remove("is-valid");
        messageInput.classList.remove("is-valid");
      }
    });

    // check when user leaves the field
    nameInput.addEventListener("blur", function () { checkInput(nameInput); });
    emailInput.addEventListener("blur", checkEmail);
    messageInput.addEventListener("blur", function () { checkInput(messageInput); });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
